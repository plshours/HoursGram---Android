name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease             -PTelegram.ApiId='${{ secrets.TELEGRAM_API_ID }}'             -PTelegram.ApiHash='${{ secrets.TELEGRAM_API_HASH }}' 2>&1 | tee build.log

      - name: Show the compiler errors
        if: failure()
        run: |
          (grep -E '^e: |error:' build.log | head -n 25; grep -A14 'What went wrong' build.log) | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done

      - name: Build the smoke-test APK with dummy keys
        run: gradle --no-daemon :app:assembleDebug -PTelegram.ApiId=1 -PTelegram.ApiHash=0123456789abcdef0123456789abcdef

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app in an emulator
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HorusGram-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
