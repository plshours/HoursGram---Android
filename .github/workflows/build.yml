name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease             -PTelegram.ApiId='${{ secrets.TELEGRAM_API_ID }}'             -PTelegram.ApiHash='${{ secrets.TELEGRAM_API_HASH }}' 2>&1 | tee build.log

      - name: Show the compiler errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not|Unresolved|not found|> ' build.log | head -n 40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: HorusGram-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
